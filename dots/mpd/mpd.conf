# MPD для nyashell: музыка играет в фоне, без окна; управление — вкладка «Медиа» в борде.
# music_directory установщик подставляет из твоей папки «Музыка» (xdg-user-dir MUSIC)
# MPD for nyashell: music plays in the background with no window; controls are in the dashboard's Media tab.
# the installer fills in music_directory from your Music folder (xdg-user-dir MUSIC)
music_directory     "~/Music"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
playlist_directory  "~/.local/share/mpd/playlists"
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}
