# kitty для nyashell — цвета подставляет шелл (nyash-theme.conf), при смене палитры kitty перечитывается сам
# kitty for nyashell: the shell supplies the colours (nyash-theme.conf); kitty reloads itself when the palette changes

# ─── шрифт: патченый Monaspace Neon (кириллица, значки, лигатуры) ───
# ─── font: patched Monaspace Neon (Cyrillic, icons, ligatures) ───
font_family      Nyaspace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
# лигатуры и «texture healing» у Monaspace (включены по умолчанию)
# Monaspace ligatures and "texture healing" (on by default)
disable_ligatures never

# ─── вид ───
# ─── look ───
window_padding_width 14
hide_window_decorations yes
background_opacity 0.94
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.08
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
# «хвост» курсора при прыжках (kitty 0.37+; в старых версиях просто проигнорируется)
# cursor "trail" on jumps (kitty 0.37+; older versions simply ignore it)
cursor_trail 3
cursor_trail_decay 0.08 0.3

# ─── вкладки и разбиения (как в konsole) ───
# ─── tabs and splits (as in konsole) ───
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template " {index} {title[:24]} "
enabled_layouts splits,stack
# Ctrl+V — вставить (и в запрос пароля sudo тоже), Ctrl+C — копировать, если что-то выделено, иначе прервать
# Ctrl+V pastes (into the sudo password prompt too), Ctrl+C copies if something is selected, otherwise interrupts
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# ─── прочее ───
# ─── misc ───
scrollback_lines 20000

# шелл при выходе сохраняет, что было на экране терминалов, и после входа показывает это снова (Session.qml).
# Для этого kitty слушает сокет в XDG_RUNTIME_DIR — папка доступна только тебе, чужие процессы до него не дотянутся
# on logout the shell saves what was on the terminals' screens and shows it again after login (Session.qml).
# For that kitty listens on a socket in XDG_RUNTIME_DIR: only you can access that folder, other processes can't reach it
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/nyash-kitty-{kitty_pid}
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes
shell fish

include nyash-theme.conf
