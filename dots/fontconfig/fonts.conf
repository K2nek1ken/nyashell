<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Nyaspace (Monaspace Neon + Cyrillic + icons) everywhere; emoji from a separate colour font -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Nyaspace</family><family>Monaspace Neon NF</family><family>emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Nyaspace</family><family>Monaspace Neon NF</family><family>emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Nyaspace</family><family>Monaspace Neon NF</family><family>emoji</family></prefer>
  </alias>
  <!-- emoji: Noto Color Emoji -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
