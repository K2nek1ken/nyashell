# какие порталы отвечают за что в сеансе mango:
# захват экрана и скриншоты по запросу приложений (демонстрация в Discord, Telegram, OBS, браузерах) — wlr,
# всё остальное (выбор файлов и т.п.) — gtk
# which portals handle what in a mango session:
# screen capture and screenshots requested by apps (sharing in Discord, Telegram, OBS, browsers): wlr,
# everything else (file chooser and so on): gtk
[preferred]
default=gtk
# настройки внешнего вида: тёмную схему отдаёт gtk, а акцент (accent-color) — kde: он читает kdeglobals,
# куда шелл пишет цвета. Так «системный акцент» видят и программы GTK4/libadwaita, и Flatpak.
# Порядок важен: gtk первым, иначе kde перебьёт схему
# appearance settings: gtk provides the dark scheme and kde the accent (accent-color): it reads kdeglobals,
# where the shell writes the colours. That way GTK4/libadwaita apps and Flatpak see the "system accent" too.
# Order matters: gtk first, otherwise kde overrides the scheme
org.freedesktop.impl.portal.Settings=gtk;kde
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
