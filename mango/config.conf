# ~/.config/mango/config.conf
# mango config for nyashell. The nya_* options (and scroller_new_at_end / scroller_snap_resize)
# only exist in mango built with the nyashell patch: install.sh builds it.

# ─── внешний вид ─────────────────────────────────────────
# ─── look ───
border_radius=5
no_radius_when_single=0
borderpx=0
focuscolor=0xf5bcd666
gappih=6
gappiv=6
gappoh=8
gappov=8
# прозрачность: все окна на 90% непрозрачности (фокус видно по затемнению)
# transparency: every window at 90% opacity (focus is shown by dimming)
focused_opacity=0.9
unfocused_opacity=0.9
# рамки нет — фокус видно по затемнению: неактивные окна чуть темнее
# no border: focus is shown by dimming, inactive windows are slightly darker
dim_enable=1
dim_unfocused_color=0x00000059
dim_focused_color=0x00000000
# блюр под окнами и под панелями шелла
# blur under windows and under the shell's panels
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes=1
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadowscolor=0x00000088

# наши панели и выпадашки анимирует сам шелл: без анимации слоёв, блюра и тени от mango
# (иначе полноэкранные слои выезжают целиком, как будто открылось другое пространство)
# the shell animates its own panels and popups: no layer animation, blur or shadow from mango
# (otherwise full-screen layers slide in whole, as if another workspace had opened)
layerrule=layer_name:^quickshell$,noanim:1,noblur:1,noshadow:1
# выделение области для скриншота (slurp) — без размытия и анимации, окна под ним остаются видны
# area selection for screenshots (slurp): no blur or animation, the windows under it stay visible
layerrule=layer_name:^(selection|slurp)$,noanim:1,noblur:1,noshadow:1

# ─── прозрачность и размытие по приложениям ───
# все окна полупрозрачные с лёгким размытием (1 проход, радиус 3) — обои видно, ноут не греется
# терминал и файловый менеджер — ещё прозрачнее
# видео, игры и просмотр картинок — всегда непрозрачные
# ─── per-app transparency and blur ───
# every window is translucent with a light blur (1 pass, radius 3): the wallpaper shows, the laptop stays cool
# the terminal and the file manager are even more transparent
# video, games and image viewers are always opaque
windowrule=appid:^(mpv|vlc|org\.gnome\.Loupe|imv|steam_app_.*|factorio|Factorio|gamescope)$,focused_opacity:1.0,unfocused_opacity:1.0

# диалоги «открыть/сохранить/импорт» (порталы GTK и KDE, kdialog, zenity) — плавающие окна по центру
# open/save/import dialogs (GTK and KDE portals, kdialog, zenity): floating windows in the centre
windowrule=appid:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|org\.freedesktop\.impl\.portal\.desktop\.kde|kdialog|zenity|org\.kde\.kdialog)$,isfloating:1,width:1100,height:680
windowrule=title:^(Open|Save|Import|Export|Select|Choose|Upload|Открыть|Сохранить|Импорт|Экспорт|Выбрать|Выберите|Загрузить).*$,isfloating:1,width:1100,height:680

# браузер из борда: без анимаций, рамки и тени. При первом запуске он тихо открывается
# на запасной 9-й странице, шелл ставит ему размер и место, и только потом показывает в борде
# обычный Firefox — всегда в сетку (он иногда сам просил плавающее окно с размером из прошлого сеанса)
# dashboard browser: no animations, border or shadow. On first launch it quietly opens
# on the spare 9th page, the shell sizes and places it, and only then shows it in the dashboard
# regular Firefox always tiles (it sometimes asked for a floating window sized from the previous session)
windowrule=appid:^(firefox|org\.mozilla\.firefox|firefox-esr)$,isfloating:0
windowrule=appid:^nyash-browser$,isnoanimation:1,isnoborder:1,isnoshadow:1,isfloating:1,tags:9,istagsilent:1,focused_opacity:1.0,unfocused_opacity:1.0

# окно копирования/переноса Nemo маленькое — при сильном скруглении углы срезали текст и полоску прогресса
# Nemo's copy/move window is small: with strong rounding the corners clipped the text and the progress bar
windowrule=appid:^nemo$,title:^(File Operations|Файловые операции|Операции с файлами|[0-9]+%.*)$,isnoradius:1

# монитор системы (клик по цифрам на панели) — плавающее окно по центру
# system monitor (click the numbers on the bar): floating window in the centre
windowrule=appid:^nyash-monitor$,isfloating:1,width:1240,height:780
# второстепенные окна программ — плавающие, как в обычных DE. Главное окно остаётся в сетке/ленте.
# Большую часть mango узнаёт сам (патч nyashell): диалоги, окна с родителем, окна фиксированного размера и
# окна-спутники вида «Что-то — Программа» (Prism Launcher, программы KDE…), см. nya_smart_float. Ниже — то, что так не узнать
# Steam: «Steam Settings» mango узнаёт сам (главное окно названо именем программы), а «Friends List» и окна без
# заголовка — нет: у них нет ни родителя, ни типа окна, ни общего заголовка с главным (проверено по xprop)
# secondary windows of apps float, as in regular DEs. The main window stays in the grid/scroller.
# mango recognises most of them itself (nyashell patch): dialogs, windows with a parent, fixed-size windows and
# companion windows named "Something — App" (Prism Launcher, KDE apps…), see nya_smart_float. Below is what can't be detected that way
# Steam: mango detects "Steam Settings" itself (the main window is named after the app), but not "Friends List" and
# untitled windows: they have no parent, no window type and no title shared with the main one (checked with xprop)
windowrule=appid:^steam$,title:^(?!Steam$).*$,isfloating:1
# мелкие системные окна (плюс то же, что caelestia-kde не даёт тайлить Krohnkite)
# small system windows (plus the ones caelestia-kde keeps Krohnkite from tiling)
windowrule=appid:^(org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|qalculate-gtk|nwg-look|qt6ct|kvantummanager|org\.gnome\.FileRoller|file-roller|org\.gnome\.Settings|system-config-printer|yad|guifetch|wev|feh|swappy)$,isfloating:1

# всплывающие уведомления Steam: плавающие, без рамки и фокуса, там, где их ставит сам Steam
# Steam notification popups: floating, no border or focus, where Steam itself puts them
windowrule=title:^notificationtoasts.*$,isfloating:1,isnoborder:1,nofocus:1,isoverlay:1,no_force_center:1

# ─── анимации ────────────────────────────────────────────
# типы — только slide/zoom/fade/none, направление slide для окон не настраивается
# ─── animations ───
# types are only slide/zoom/fade/none; the slide direction for windows can't be configured
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.9
tag_animation_direction=1
animation_duration_open=300
# закрытие короче перестройки соседей и с ускорением (как «уход» в Material 3):
# окно успевает исчезнуть, пока соседи ещё занимают его место
# closing is shorter than the neighbours' rearrangement and accelerates (like an exit in Material 3):
# the window is gone while the neighbours are still taking its place
animation_duration_close=180
animation_duration_move=280
animation_duration_tag=320
animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.3,0.0,0.8,0.15
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1

# ─── программы Qt — как в KDE ───────────────────────────
# платформенная тема KDE (пакет plasma-integration) для всех Qt-программ сеанса: они берут цвета, акцент,
# значки и шрифты из kdeglobals — туда их пишет шелл (Telegram/AyuGram «системный акцент» и любые
# другие программы, которые так умеют в KDE). Диалоги «открыть/сохранить» у них идут через портал —
# тот же диалог, что и у остальных программ, а не встроенный в Qt
# ─── Qt apps, as on KDE ───
# the KDE platform theme (plasma-integration package) for every Qt app in the session: they take colours, accent,
# icons and fonts from kdeglobals, where the shell writes them (Telegram/AyuGram "system accent" and any
# other app that can do this on KDE). Their open/save dialogs go through the portal,
# the same dialog as every other app, not the one built into Qt
env=QT_QPA_PLATFORMTHEME,kde
env=PLASMA_INTEGRATION_USE_PORTAL,1
# те же переменные — службам D-Bus и systemd (порталы и программы, запущенные через них)
# the same variables for D-Bus and systemd services (portals and the apps they start)
exec-once=sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME PLASMA_INTEGRATION_USE_PORTAL 2>/dev/null || dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME PLASMA_INTEGRATION_USE_PORTAL'

# ─── автозапуск ──────────────────────────────────────────
# шелл с ними тоже запускается: всё, что он открывает (меню приложений, кнопки), наследует его окружение
# ─── autostart ───
# the shell starts with them too: everything it opens (app menu, buttons) inherits its environment
exec-once=qs -c nyashell
# если mpd запускает systemd (так ставит установщик) — сами не запускаем: два mpd одновременно
# дрались за порт 6600, и звук с управлением расходились по разным копиям
# if systemd starts mpd (that's how the installer sets it up), we don't: two mpd at once
# fought over port 6600, and sound and controls ended up in different copies
exec-once=sh -c 'systemctl --user is-enabled mpd >/dev/null 2>&1 || { pgrep -x mpd >/dev/null || mpd; }; systemctl --user is-enabled mpd-mpris >/dev/null 2>&1 || { pgrep -x mpd-mpris >/dev/null || (command -v mpd-mpris >/dev/null && mpd-mpris); }'
# звук без systemd (Artix): PipeWire сам не стартует — его пользовательские службы есть только у systemd.
# Запускаем сами, если он ещё не идёт и это не PulseAudio
# sound without systemd (Artix): PipeWire doesn't start by itself, its user services only exist under systemd.
# We start it ourselves if it isn't running yet and this isn't PulseAudio
exec-once=sh -c '[ -d /run/systemd/system ] && exit 0; pgrep -x pipewire >/dev/null && exit 0; command -v pulseaudio >/dev/null && ! command -v pipewire-pulse >/dev/null && exit 0; if command -v artix-pipewire-launcher >/dev/null; then exec artix-pipewire-launcher; fi; pipewire & sleep 0.5; command -v pipewire-pulse >/dev/null && pipewire-pulse & command -v wireplumber >/dev/null && wireplumber & wait'
# история буфера обмена (нужны cliphist и wl-clipboard)
# clipboard history (needs cliphist and wl-clipboard)
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# ─── keyboard: install.sh puts your system layouts here; Alt+Shift switches (Settings → Look) ───
xkb_rules_layout=us
xkb_rules_options=grp:alt_shift_toggle

# ─── раскладки ───────────────────────────────────────────
# число страниц (Настройки → Окна); последняя — ещё и стоянка браузера из борда (правило nyash-browser выше)
# ─── layouts ───
# number of pages (Settings → Windows); the last one is also where the dashboard browser parks (nyash-browser rule above)
tag_num=9
# теги 1–4: лента (niri-like), 5–9: ровная сетка до 4 окон (fair)
# tags 1–4: scroller (niri-like), 5–9: even grid of up to 4 windows (fair)
tagrule=id:1,layout_name:fair
tagrule=id:2,layout_name:fair
tagrule=id:3,layout_name:fair
tagrule=id:4,layout_name:fair
tagrule=id:5,layout_name:fair
tagrule=id:6,layout_name:fair
tagrule=id:7,layout_name:fair
tagrule=id:8,layout_name:fair
tagrule=id:9,layout_name:fair

# super+tab: лента ↔ ровная сетка (мастер+стек пока выключен)
# super+tab: scroller ↔ even grid (master+stack is off for now)
circle_layout=scroller,fair

# лента: три колонки на экран, окно можно растянуть на 2 или 3 (super+e)
# scroller: three columns per screen, a window can span 2 or 3 (super+e)
scroller_default_proportion=0.333
scroller_proportion_preset=0.333,0.666,1.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1
# патч nyashell:
# новые окна в конец ленты, super+пкм прилипает к колонкам
# nyashell patch:
# new windows go to the end of the scroller, super+right-drag snaps to columns
scroller_new_at_end=1
scroller_snap_resize=1
# анимации окон (тоже из патча): новые — снизу, закрытие — падение в ленте, сплющивание в сетке
# window animations (also from the patch): new ones come from below, closing falls in the scroller and squashes in the grid
nya_open_from_bottom=1
nya_layout_close=1
# перетаскивание (super+лкм или ctrl+super+лкм) тайлового окна: оно слегка уменьшается и едет за курсором,
# его место остаётся занятым и переезжает туда, где висит курсор — остальные окна не расползаются;
# с ctrl+super+лкм: подержи окно у левого/правого края ~полсекунды — оно переедет на соседнюю страницу
# dragging a tiled window (super+left-drag or ctrl+super+left-drag): it shrinks slightly and follows the cursor,
# its slot stays taken and moves to wherever the cursor hovers, so the other windows don't spread out;
# with ctrl+super+left-drag: hold the window at the left/right edge for ~half a second and it moves to the next page
nya_live_drag=1
nya_drag_scale=0.95
# сетка всегда ровная: super+пкм наружу до упора — сосед уезжает на следующую страницу,
# внутрь до упора — окно со следующей страницы возвращается сюда
# the grid is always even: super+right-drag outward all the way pushes a neighbour to the next page,
# inward all the way brings a window back from the next page
nya_grid_snap=1
# лента: два окна одинаковой ширины делят экран пополам
# scroller: two windows of equal width split the screen in half
nya_scroller_half=1
# сворачивание — с анимацией закрытия, разворачивание — с анимацией появления
# minimising plays the close animation, restoring plays the open animation
nya_minimize_anim=1
# окна-спутники вида «Настройки — Программа» открываются плавающими (0 — выключить)
# companion windows like "Settings — App" open floating (0 to turn off)
nya_smart_float=1
# фон mango до старта шелла — цвета рамки (шелл подставляет цвет своей палитры)
# mango's background before the shell starts: the frame colour (the shell writes its palette's colour here)
rootcolor=0x191616ff

# ─── клавиши ─────────────────────────────────────────────
# страницы (теги) — через шелл: в ленте сначала листают окна по одному, с крайнего — страницу;
# если активное окно в фуллскрине, сначала шлём ему Esc
# ─── keys ───
# pages (tags) go through the shell: in the scroller it steps one window at a time first, from the last one it flips the page;
# if the active window is full-screen, it gets Esc first
bind=CTRL+SHIFT,a,spawn,qs -c nyashell ipc call pages prev
bind=CTRL+SHIFT,d,spawn,qs -c nyashell ipc call pages next
# перекинуть окно на соседнюю страницу
# move the window to the neighbouring page
bind=SUPER+SHIFT,a,tagtoleft
bind=SUPER+SHIFT,d,tagtoright

# приложения (временные заглушки до своего шелла)
# apps (temporary placeholders until our own shell had them)
bind=SUPER,a,spawn,kitty
bind=SUPER,d,spawn_shell,sh ~/.config/quickshell/nyashell/files/nemo-open.sh
bind=SUPER,s,spawn,qs -c nyashell ipc call dashboard toggle
bind=SUPER,l,spawn,qs -c nyashell ipc call lock lock
bind=SUPER,v,spawn,qs -c nyashell ipc call widgets clipboard
bind=SUPER,r,spawn,qs -c nyashell ipc call widgets calc
bind=SUPER,space,spawn,qs -c nyashell ipc call widgets power
bind=SUPER,i,spawn,qs -c nyashell ipc call widgets settings
bind=SUPER,w,spawn,qs -c nyashell ipc call widgets monitor
# выбор обоев: A/D или стрелки — листать, пробел/Enter — поставить
# wallpaper picker: A/D or arrows to browse, space/Enter to set
bind=CTRL+SHIFT,f,spawn,qs -c nyashell ipc call widgets wallpaper
bind=SUPER,g,spawn,qs -c nyashell ipc call widgets lang
# гифки на экране: Ctrl+Alt+G — двигать и менять размер (ещё раз — готово)
# on-screen GIFs: Ctrl+Alt+G to move and resize (again to finish)
bind=CTRL+ALT,g,spawn,qs -c nyashell ipc call widgets gifs
# медиаклавиши: через MPRIS (любой плеер), если playerctl нет — напрямую mpd
# media keys: via MPRIS (any player); without playerctl, straight to mpd
bindl=NONE,XF86AudioPlay,spawn,sh -c 'playerctl play-pause 2>/dev/null || mpc -q toggle'
bindl=NONE,XF86AudioNext,spawn,sh -c 'playerctl next 2>/dev/null || mpc -q next'
bindl=NONE,XF86AudioPrev,spawn,sh -c 'playerctl previous 2>/dev/null || mpc -q prev'
# треки без борда: Ctrl+Alt+A/D — назад/вперёд, Ctrl+Shift+Space — пауза/играть (bindl — работают и на экране блокировки).
# «назад» — всегда предыдущий трек, а не начало текущего
# tracks without the dashboard: Ctrl+Alt+A/D back/forward, Ctrl+Shift+Space pause/play (bindl: they work on the lock screen too).
# "back" is always the previous track, not the start of the current one
bindl=CTRL+ALT,a,spawn,sh -c 'pgrep -x mpd >/dev/null && sh $HOME/.config/quickshell/nyashell/mpd-skip.sh prev || playerctl previous'
bindl=CTRL+ALT,d,spawn,sh -c 'pgrep -x mpd >/dev/null && sh $HOME/.config/quickshell/nyashell/mpd-skip.sh next || playerctl next'
# перемешивание и повтор (список → трек → выкл) — без сочетаний: назначь в Настройки → Клавиши
# shuffle and repeat (list → track → off) — no shortcuts: assign them in Settings → Keys
#nyash-off bindl=NONE,none,spawn,qs -c nyashell ipc call player shuffle
#nyash-off bindl=NONE,none,spawn,qs -c nyashell ipc call player repeat
bindl=CTRL+SHIFT,space,spawn,sh -c 'mpc -q toggle 2>/dev/null || playerctl play-pause'
# скриншоты: весь экран — Print или Super+Shift+S; область — Shift+Print или Super+Shift+ЛКМ
# screenshots: whole screen with Print or Super+Shift+S; area with Shift+Print or Super+Shift+left-drag
bind=NONE,Print,spawn,sh -c 'sh $HOME/.config/quickshell/nyashell/screenshot.sh full'
bind=SUPER+SHIFT,s,spawn,sh -c 'sh $HOME/.config/quickshell/nyashell/screenshot.sh full'
bind=SHIFT,Print,spawn,sh -c 'sh $HOME/.config/quickshell/nyashell/screenshot.sh area'
# запись экрана: Ctrl+Print — весь экран, Ctrl+Shift+Print — область; то же сочетание ещё раз — стоп
# screen recording: Ctrl+Print whole screen, Ctrl+Shift+Print area; the same keys again stop it
bind=CTRL,Print,spawn,qs -c nyashell ipc call widgets record
bind=CTRL+SHIFT,Print,spawn,qs -c nyashell ipc call widgets recordArea
# с микрофоном (звук системы + микрофон вместе): Ctrl+Alt+Print — весь экран, Ctrl+Alt+Shift+Print — область
# with the microphone (system sound + mic together): Ctrl+Alt+Print whole screen, Ctrl+Alt+Shift+Print area
bind=CTRL+ALT,Print,spawn,qs -c nyashell ipc call widgets recordMic
bind=CTRL+ALT+SHIFT,Print,spawn,qs -c nyashell ipc call widgets recordAreaMic
# выделение рисует сам mango: зажал Super+Shift, нажал ЛКМ и тянешь — отпустил, и снимок готов
# mango draws the selection itself: hold Super+Shift, press the left button and drag; let go and the shot is taken
mousebind=SUPER+SHIFT,btn_left,nya_shot_region,0
bind=ALT,q,killclient
# ctrl+q — свернуть окно
# ctrl+q: minimise the window
bind=CTRL,q,minimized
# super+q — завершить приложение окна в фокусе целиком, со всеми его процессами (Steam и т.п.)
# super+q: kill the focused window's whole app, with all its processes (Steam and the like)
bind=SUPER,q,spawn,qs -c nyashell ipc call widgets killApp

# меню приложений по отпусканию super (в фуллскрине шелл его игнорирует)
# app menu on releasing super (the shell ignores it in full screen)
bindr=Super,Super_L,spawn,qs -c nyashell ipc call launcher toggle

# окна
# windows
bind=SUPER,f,togglefullscreen
bind=SUPER,c,togglefloating
bind=SUPER,Tab,switch_layout
bind=SUPER,e,switch_proportion_preset
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Down,move_client,down

# система
# system
bind=SUPER+SHIFT,r,reload_config
# перезапустить шелл, если что-то зависло (без выхода из сеанса)
# restart the shell if something hangs (without leaving the session)
bind=SUPER+CTRL,r,spawn,sh -c 'sh $HOME/.config/quickshell/nyashell/restart.sh'
# выход — через шелл, чтобы сохранился сеанс; если шелл не отвечает — выходим напрямую
# quit through the shell so the session gets saved; if the shell doesn't answer, quit directly
bind=SUPER+SHIFT,m,spawn_shell,timeout 3 qs -c nyashell ipc call session logout || mmsg dispatch quit

# ─── мышь ────────────────────────────────────────────────
# ─── mouse ───
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+CTRL,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# super + колесо — листать страницы
# super + wheel: flip pages
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# ─── медиаклавиши ────────────────────────────────────────
# ─── media keys ───
bind=NONE,XF86MonBrightnessUp,spawn,qs -c nyashell ipc call osd brightness_up
bind=NONE,XF86MonBrightnessDown,spawn,qs -c nyashell ipc call osd brightness_down
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c nyashell ipc call osd volume_up
bind=NONE,XF86AudioLowerVolume,spawn,qs -c nyashell ipc call osd volume_down
bind=NONE,XF86AudioMute,spawn,qs -c nyashell ipc call osd mute

# восстановление сеанса: шелл кладёт сюда одноразовые правила «окно → его страница» и после очищает файл
# session restore: the shell puts one-time "window → its page" rules here and clears the file afterwards
source-optional=./nyash-restore.conf
